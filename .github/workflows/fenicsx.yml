name: FEniCSx Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-fenicsx:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: test-fenicsx
          environment-file: environment-fenicsx.yml

      - name: Install PDEForge
        run: pip install -e .

      - name: Test FEniCSx import
        run: |
          python -c "import dolfinx; print(f'FEniCSx {dolfinx.__version__}')"
          python -c "from pdeforge import list_models; print(list_models())"

      - name: Run FEniCSx tests
        run: pytest tests/test_fenicsx.py -v || echo "FEniCSx tests skipped or failed"
