[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeforge"
version = "0.1.0"
description = "A unified framework for generating PDE datasets for operator learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peter Yatsyshin", email = "pyatsyshin@turing.ac.uk"},
]
keywords = [
    "pde",
    "operator-learning",
    "neural-operators",
    "scientific-computing",
    "machine-learning",
    "data-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.10",
    "mypy>=1.0",
]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=7.6",
]
hdf5 = [
    "h5py>=3.0",
]
# Note: FEniCSx must be installed via conda, not pip
# conda install -c conda-forge fenics-dolfinx mpich petsc4py gmsh python-gmsh
fenicsx = [
    "gmsh>=4.11",  # pip-installable part
]
all = [
    "pdeforge[dev,notebook,hdf5]",
]

[project.urls]
Homepage = "https://github.com/pyatsysh/pdeforge"
Documentation = "https://pyatsysh.github.io/pdeforge"
Repository = "https://github.com/pyatsysh/pdeforge"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdeforge*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pdeforge --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
