[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeforge"
version = "0.2.0.dev0"
description = "A unified framework for generating PDE datasets for operator learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peter Yatsyshin", email = "p.yatsyshin@icloud.com"},
]
keywords = [
    "pde",
    "operator-learning",
    "neural-operators",
    "scientific-computing",
    "machine-learning",
    "data-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.10",
    "mypy>=1.0",
]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=7.6",
]
hdf5 = [
    "h5py>=3.0",
]
zarr = [
    "zarr>=2.16",
]
viz3d = [
    "pyvista>=0.43",
]
jax = [
    "jax>=0.4.20",
]
torch = [
    "torch>=2.0",
]
# Note: FEniCSx must be installed via conda, not pip
# conda install -c conda-forge fenics-dolfinx mpich petsc4py gmsh python-gmsh
fenicsx = [
    "gmsh>=4.11",  # pip-installable part
]
all = [
    "pdeforge[dev,notebook,hdf5,zarr,jax,torch,viz3d]",
]

[project.scripts]
pdeforge = "pdeforge.cli:main"

[project.urls]
Homepage = "https://github.com/pyatsysh/pdeforge"
Documentation = "https://pyatsysh.github.io/PDEForge"
Repository = "https://github.com/pyatsysh/pdeforge"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdeforge*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pdeforge --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
# Disable error codes that are noisy for numpy-heavy scientific code
disable_error_code = ["override", "assignment", "arg-type", "return-value", "call-arg", "call-overload", "union-attr", "var-annotated", "no-redef", "misc"]
