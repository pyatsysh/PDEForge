site_name: PDEForge
site_description: A unified framework for generating PDE datasets for operator learning
site_url: https://pyatsysh.github.io/PDEForge
repo_url: https://github.com/pyatsysh/pdeforge
repo_name: pyatsysh/pdeforge

theme:
  name: material
  custom_dir: overrides
  font:
    # the site's font2 set: Crimson Text body, Roboto Mono code
    # (Fredericka the Great / Headland One display faces load in nord.css)
    text: Crimson Text
    code: Roboto Mono
  palette:
    # theme2 by day (frost menu bar on snow storm), polar night by dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/nord.css

extra_javascript:
  - javascripts/mathjax.js
  # polyfill.io removed: the domain was hijacked (2024 supply-chain attack)
  # and injects popups/redirects; modern browsers need no polyfill here.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

